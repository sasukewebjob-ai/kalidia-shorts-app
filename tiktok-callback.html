<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TikTok 連携 | KALIDIA Shorts</title>
<style>
  body { margin:0; font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif; background:#f6f5f1; color:#1f2a24; }
  main { max-width:560px; margin:0 auto; padding:48px 16px; line-height:1.8; }
  @media (prefers-color-scheme: dark) { body { background:#121714; color:#e6ebe7; } }
</style>
</head>
<body>
<main>
  <h1>TikTok 連携</h1>
  <p id="msg">運営者のパソコンの投稿ツールに戻ります…</p>
</main>
<script>
  // TikTok の許可のあと、ここに ?code=...&state=... で戻ってくる。
  // 運営者のパソコンで待っている投稿ツール（localhost:8723）へ、そのまま渡す。
  // このページ自体は何も保存・送信しない。
  (function () {
    var q = location.search;
    if (q.indexOf("code=") >= 0 || q.indexOf("error=") >= 0) {
      location.replace("http://localhost:8723/callback/" + q);
    } else {
      document.getElementById("msg").textContent = "このページは KALIDIA Shorts の TikTok 連携の戻り先です。";
    }
  })();
</script>
</body>
</html>
